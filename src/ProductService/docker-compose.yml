version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product-service
    ports:
      - 15433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: