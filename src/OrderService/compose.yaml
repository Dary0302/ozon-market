services:
  orderservice.api:
    image: orderservice.api
    build:
      context: ..
      dockerfile: OrderService/OrderService.Api/Dockerfile
    ports:
      - "8082:5230"
      - "8083:5231"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=order-db;Username=order-user;Password=order-pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - order-network

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=order-db
      - POSTGRES_USER=order-user
      - POSTGRES_PASSWORD=order-pass
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order-user -d order-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - order-network

networks:
  order-network:
    driver: bridge

volumes:
  postgres_data: